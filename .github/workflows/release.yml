on:
  release:
    types:
      - published

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v3
      # Setup .npmrc file to publish to npmjs.org
      - uses: actions/setup-node@v3
        with:
          node-version: "25"
          registry-url: "https://registry.npmjs.org"
      - run: npm install
      - run: npm run build
      - run: npm publish
